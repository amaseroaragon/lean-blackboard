name = "lean-sample"
defaultTargets = ["LeanSample", "FastSample"]

# Companion package for precise mode (local path; see docs/en/precise-mode.md).
[[require]]
name = "LeanBlackboard"
path = "../../lean"

[[lean_lib]]
name = "LeanSample"

# Same kind of proofs WITHOUT `import LeanBlackboard`: exercises the fast mode.
[[lean_lib]]
name = "FastSample"
